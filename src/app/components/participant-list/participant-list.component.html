<div class="card shadow-sm h-100 d-flex flex-column">
  <div
    class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-2"
  >
    <span class="fw-bold small">Alle Teilnehmer</span>
    <span class="badge bg-light text-dark">{{ participants().length }}</span>
  </div>
  <div class="p-1.5 bg-light border-bottom">
    <select class="form-select form-select-sm rounded-0" (change)="roleFilterChange.emit($event)">
    <option value="">Alle Mitarbeiter Rollen</option>
    @for (role of availableMaRollen(); track role) {
      <option [value]="role">{{ role }}</option>
    }
  </select>
  </div>
  @if (hasAnmeldungen()) {
    <div class="p-1.5 bg-light border-bottom">
      <select class="form-select form-select-sm rounded-0" (change)="filterChange.emit($event)">
        <option value='{"type":"all","value":null}'>Kein Filter</option>
        <optgroup label="Geschlecht">
          <option value='{"type":"gender","value":1}'>Jungs</option>
          <option value='{"type":"gender","value":2}'>Mädchen</option>
        </optgroup>
        <optgroup label="Wünsche">
          <option value='{"type":"wunsch","value":"zugeordnet"}'>zugeordnet</option>
          <option value='{"type":"wunsch","value":"teilweise"}'>teilweise</option>
          <option value='{"type":"wunsch","value":"ignoriert"}'>ignoriert</option>
          <option value='{"type":"wunsch","value":"keine"}'>keine Wünsche</option>
        </optgroup>
        @if (availableAges().length > 0) {
          <optgroup label="Alter">
            @for (age of availableAges(); track age) {
              <option
                value="{&quot;type&quot;:&quot;age&quot;,&quot;value&quot;:{{
                  age === null ? 'null' : age
                }}}"
              >
                @if (age === null) {
                  keine Angabe
                } @else {
                  {{ age }} Jahre
                }
              </option>
            }
          </optgroup>
        }
      </select>
      <select
        class="form-select form-select-sm rounded-0"
        [ngModel]="currentSort()"
        (ngModelChange)="sortChange.emit($event)"
      >
        @if (activeGrouping() !== 'none') {
          <option [ngValue]="'groupSize_desc'">Gruppengröße (absteigend)</option>
          <option [ngValue]="'groupSize_asc'">Gruppengröße (aufsteigend)</option>
          @if (activeGrouping() === 'zip') {
            <option [ngValue]="'group_asc'">PLZ (aufsteigend)</option>
            <option [ngValue]="'group_desc'">PLZ (absteigend)</option>
          }
          @if (activeGrouping() === 'city') {
            <option [ngValue]="'group_asc'">Ort (A bis Z)</option>
            <option [ngValue]="'group_desc'">Ort (Z bis A)</option>
          }
          <option disabled>──────────</option>
        }
        <option [ngValue]="'lastName_asc'">Nachname (A bis Z)</option>
        <option [ngValue]="'lastName_desc'">Nachname (Z bis A)</option>
        <option [ngValue]="'firstName_asc'">Vorname (A bis Z)</option>
        <option [ngValue]="'firstName_desc'">Vorname (Z bis A)</option>
        <option [ngValue]="'age_asc'">Alter (aufsteigend)</option>
        <option [ngValue]="'age_desc'">Alter (absteigend)</option>
        @if (showIds()) {
          <option [ngValue]="'id_asc'">ID (aufsteigend)</option>
          <option [ngValue]="'id_desc'">ID (absteigend)</option>
        }
      </select>
      <select
        class="form-select form-select-sm rounded-0"
        [ngModel]="activeGrouping()"
        (ngModelChange)="groupingChange.emit($event)"
      >
        <option [ngValue]="'none'">keine Gruppierung</option>
        <option [ngValue]="'zip'">nach PLZ gruppiert</option>
        <option [ngValue]="'city'">nach Ort gruppiert</option>
        <option [ngValue]="'wunsch'">nach Wünschen gruppiert</option>
      </select>
      <input
        type="text"
        class="form-control form-control-sm rounded-0"
        placeholder="Suchen..."
        (input)="searchChange.emit($event)"
      />
    </div>
    <div
      class="card-body p-2 group-body bg-light main-pool flex-grow-1"
      [class.drag-over]="dragOverZone() === 'main'"
      (dragover)="dragOverNode.emit($event)"
      (dragleave)="dragLeaveNode.emit($event)"
      (drop)="dropNode.emit($event)"
    >
      @for (item of participants(); track getItemId(item)) {
        @if (isGroupWrapper(item)) {
          <app-group-wrapper-card
            class="mb-1"
            [group]="item"
            sourceZone="main"
            [showIds]="showIds()"
            [details]="details()"
            [allParticipants]="allParticipants()"
            [currentZoneParticipants]="item.participants"
            (dragStartItem)="dragStartItem.emit($event)"
            (dblClickItem)="dblClickItem.emit($event)"
          ></app-group-wrapper-card>
        } @else {
          <app-participant-card
            [item]="item"
            sourceZone="main"
            [showIds]="showIds()"
            [details]="details()"
            [allParticipants]="allParticipants()"
            [currentZoneParticipants]="participantsAsMembers()"
            (dragStartNode)="
              dragStartItem.emit({
                event: $event,
                payload: { type: 'PARTICIPANT', sourceZone: 'main', data: item },
              })
            "
            (dblClickNode)="
              dblClickItem.emit({
                event: $event,
                payload: { type: 'PARTICIPANT', sourceZone: 'main', data: item },
              })
            "
          ></app-participant-card>
        }
      } @empty {
        <div class="text-center text-muted mt-3 small">Keine Teilnehmer gefunden.</div>
      }
    </div>
  }
</div>
