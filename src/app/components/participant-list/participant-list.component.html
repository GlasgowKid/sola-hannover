<div class="card shadow-sm h-100 d-flex flex-column">
  <div
    class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-2"
  >
    <span class="fw-bold small">Alle Teilnehmer</span>
    <span class="badge bg-light text-dark">{{ participants().length }}</span>
  </div>
  @if (hasAnmeldungen()) {
    <div class="p-1.5 bg-light border-bottom">
      <select class="form-select form-select-sm rounded-0" (change)="filterChange.emit($event)">
        <option value='{"type":"all","value":null}'>Kein Filter</option>
        <optgroup label="Geschlecht">
          <option value='{"type":"gender","value":1}'>Jungs</option>
          <option value='{"type":"gender","value":2}'>Mädchen</option>
        </optgroup>
        <optgroup label="Wünsche">
          <option value='{"type":"wunsch","value":"zugeordnet"}'>zugeordnet</option>
          <option value='{"type":"wunsch","value":"teilweise"}'>teilweise</option>
          <option value='{"type":"wunsch","value":"ignoriert"}'>ignoriert</option>
          <option value='{"type":"wunsch","value":"keine"}'>keine Wünsche</option>
        </optgroup>
        @if (availableAges().length > 0) {
          <optgroup label="Alter">
            @for (age of availableAges(); track age) {
              <option
                value="{&quot;type&quot;:&quot;age&quot;,&quot;value&quot;:{{
                  age === null ? 'null' : age
                }}}"
              >
                @if (age === null) {
                  keine Angabe
                } @else {
                  {{ age }} Jahre
                }
              </option>
            }
          </optgroup>
        }
      </select>
      <select class="form-select form-select-sm rounded-0" (change)="sortChange.emit($event)">
        <option value="lastName_asc" selected>Nachname (A bis Z)</option>
        <option value="lastName_desc">Nachname (Z bis A)</option>
        <option value="firstName_asc">Vorname (A bis Z)</option>
        <option value="firstName_desc">Vorname (Z bis A)</option>
        <option value="age_asc">Alter (aufsteigend)</option>
        <option value="age_desc">Alter (absteigend)</option>
        @if (showIds()) {
          <option value="id_asc">ID (aufsteigend)</option>
          <option value="id_desc">ID (absteigend)</option>
        }
      </select>
      <select class="form-select form-select-sm rounded-0" (change)="groupingChange.emit($event)">
        <option value="none" selected>Keine Gruppierung</option>
        <option value="zip">Nach PLZ gruppiert</option>
        <option value="city">Nach Ort gruppiert</option>
      </select>
      <input
        type="text"
        class="form-control form-control-sm rounded-0"
        placeholder="Suchen..."
        (input)="searchChange.emit($event)"
      />
    </div>
    <div
      class="card-body p-2 group-body bg-light main-pool flex-grow-1"
      [class.drag-over]="dragOverZone() === 'main'"
      (dragover)="dragOverNode.emit($event)"
      (dragleave)="dragLeaveNode.emit($event)"
      (drop)="dropNode.emit($event)"
    >
      @for (item of participants(); track getItemId(item)) {
        @if (isGroupWrapper(item)) {
          <div
            class="card shadow-sm group-wrapper-card d-flex flex-column mb-1 cursor-grab"
            draggable="true"
            (dragstart)="
              dragStartItem.emit({
                event: $event,
                payload: { type: 'GROUP', sourceZone: 'main', data: item },
              })
            "
          >
            <div class="text-center text-muted small bg-light border-bottom" style="opacity: 0.5">
              <i class="bi bi-grid-3x3-gap-fill"></i>
              @if (item.name) {
                <span class="ms-1 fw-bold">{{ item.name }}</span>
              }
            </div>
            <div class="card-body p-1 bg-white">
              @for (p of item.participants; track p.id) {
                <app-participant-card
                  [item]="p"
                  sourceZone="main"
                  [showIds]="showIds()"
                  [details]="details()"
                  [allParticipants]="allParticipants()"
                  [currentZoneParticipants]="item.participants"
                  (dragStartNode)="
                    dragStartItem.emit({
                      event: $event,
                      payload: { type: 'PARTICIPANT', sourceZone: 'main', data: p },
                    })
                  "
                ></app-participant-card>
              }
            </div>
          </div>
        } @else {
          <app-participant-card
            [item]="item"
            sourceZone="main"
            [showIds]="showIds()"
            [details]="details()"
            [allParticipants]="allParticipants()"
            [currentZoneParticipants]="participantsAsMembers()"
            (dragStartNode)="
              dragStartItem.emit({
                event: $event,
                payload: { type: 'PARTICIPANT', sourceZone: 'main', data: item },
              })
            "
          ></app-participant-card>
        }
      } @empty {
        <div class="text-center text-muted mt-3 small">Keine Teilnehmer gefunden.</div>
      }
    </div>
  }
</div>
