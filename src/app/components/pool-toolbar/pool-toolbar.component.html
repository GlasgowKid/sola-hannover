<nav
  class="navbar navbar-expand-md navbar-light bg-light border rounded shadow-sm p-2 sticky-bottom"
  [class.is-dragging-nav]="isDragging()"
  [style.top.px]="isDragging() ? dragTop() : null"
>
  <div class="container-fluid px-1 d-flex flex-wrap gap-3 justify-content-between">
    <div class="d-flex align-items-center gap-3">
      <div class="form-check form-switch m-0">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="idToggle"
          [checked]="showIds()"
          (change)="toggleIds.emit()"
        />
        <label class="form-check-label fw-semibold text-muted small" for="idToggle">Debug</label>
      </div>
      <div class="form-check form-switch m-0">
        <input
          class="form-check-input"
          type="checkbox"
          role="switch"
          id="details"
          [checked]="details()"
          (change)="toggleDetails.emit()"
        />
        <label class="form-check-label fw-semibold text-muted small" for="details">Details</label>
      </div>
    </div>

    <div class="d-flex align-items-stretch gap-2 py-1">
      <span class="navbar-text fw-bold text-uppercase small py-0 d-flex align-items-center"
        >Pool:</span
      >
      <div class="d-flex gap-2 align-items-stretch pool-wrappers">
        @for (wrap of pools(); track wrap.id) {
          <div
            class="card shadow-sm group-wrapper-card d-flex flex-column cursor-grab"
            draggable="true"
            (dragstart)="
              dragStartItem.emit({
                event: $event,
                payload: { type: 'POOL', sourceZone: wrap.id, data: wrap.participants },
              })
            "
          >
            <div class="text-center text-muted small bg-light border-bottom" style="opacity: 0.5">
              <i class="bi bi-grid-3x3-gap-fill"></i>
              @if (wrap.name) {
                <span class="ms-1 fw-bold">{{ wrap.name }}</span>
              }
            </div>
            @if (details()) {
              <div
                class="p-1 bg-light border-bottom text-center small text-muted"
                style="font-size: 0.7rem"
              >
                <span class="text-primary">{{ getBoysCount(wrap) }}</span> /
                <span class="text-danger">{{ getGirlsCount(wrap) }}</span>
                | Ø: {{ getAverageAge(wrap) }} | Var: {{ getAgeVariance(wrap) }}
              </div>
            }
            <div
              class="card-body p-1 flex-grow-1 bg-white wrapper-body"
              [class.drag-over]="dragOverZone() === wrap.id"
              (dragover)="dragOverNode.emit({ event: $event, zone: wrap.id })"
              (dragleave)="dragLeaveNode.emit({ event: $event, zone: wrap.id })"
              (drop)="dropNode.emit({ event: $event, zone: wrap.id })"
            >
              @for (p of wrap.participants; track p.id) {
                <app-participant-card
                  [item]="p"
                  [sourceZone]="wrap.id"
                  [showIds]="showIds()"
                  [details]="details()"
                  [allParticipants]="allParticipants()"
                  [currentZoneParticipants]="wrap.participants"
                  (dragStartNode)="
                    dragStartItem.emit({
                      event: $event,
                      payload: { type: 'PARTICIPANT', sourceZone: wrap.id, data: p },
                    })
                  "
                  (resetNode)="resetItem.emit(p)"
                >
                </app-participant-card>
              }
            </div>
          </div>
        }
      </div>
    </div>

    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-sm btn-outline-danger py-0.5 px-2" (click)="confirmLoadServer.emit()">
        <i class="bi bi-cloud-download"></i> Letzte Einteilung abrufen
      </button>
      <button
        class="btn btn-sm btn-primary py-0.5 px-2"
        (click)="saveGroupsServer.emit()"
        [disabled]="progress() > 0 || !isDirty()"
      >
        <i class="bi bi-cloud-upload"></i> Stammeseinteilung übertragen
        @if (progress() > 0) {
          ({{ progress() | percent }})
        }
      </button>
    </div>
  </div>
</nav>
