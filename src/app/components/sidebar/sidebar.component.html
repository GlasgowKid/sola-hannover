<div class="sidebar-container d-flex flex-column">
  <a routerLink="/" class="d-flex align-items-center text-decoration-none brand-header">
    <span class="brand-title">SOLA Admin</span>
  </a>

  <ul class="nav nav-pills flex-column w-100 gap-1 mt-1">
    @for (item of menuItems; track item.path) {
      <li class="nav-item">
        <a 
          [routerLink]="item.path" 
          routerLinkActive="active" 
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="nav-link d-flex align-items-center gap-2.5"
        >
          <span class="text-truncate">{{ item.title }}</span>
        </a>
      </li>
    }
  </ul>
</div>
