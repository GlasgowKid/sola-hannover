<app-sola-selector
  [jahre]="$jahre()"
  [solawochen]="$solawochen()"
  (yearSelected)="onYearSelected($event)"
  (weekSelected)="onWeekSelected($event)"
></app-sola-selector>

<div
  class="container-fluid px-0 d-flex flex-column gap-3 mt-3 flex-grow-1"
  [class.is-dragging-container]="isDragging()"
  (dragend)="onDragEnd()"
>
  <div class="row g-3 align-items-stretch flex-grow-1">
    <!-- Linke Spalte: Alle Teilnehmer (MAIN) -->
    <div class="col-xl-2 col-lg-3 col-md-4 d-flex flex-column">
      <div class="flex-grow-1" style="height: 0">
        <app-participant-list
          class="d-block h-100"
          [participants]="filteredParticipants()"
          [dragOverZone]="dragOverZone()"
          [showIds]="showIds()"
          [hasAnmeldungen]="$anmeldungen().length > 0"
          [details]="details()"
          [availableAges]="availableAges()"
          [allParticipants]="allParticipants()"
          (filterChange)="onFilterChange($event)"
          (sortChange)="onSortChange($event)"
          (groupingChange)="onGroupingChange($event)"
          (searchChange)="updateSearch($event)"
          (dragOverNode)="allowDrop($event, 'main')"
          (dragLeaveNode)="onDragLeave($event, 'main')"
          (dropNode)="onDrop($event, 'main')"
          (dragStartItem)="onDragStart($event.event, $event.payload)"
        ></app-participant-list>
      </div>
    </div>

    <!-- Rechte Spalte: 8 Stämme -->
    <div class="col-xl-10 col-lg-9 col-md-8">
      <div class="row g-3">
        @for (group of $staemme(); track $index; let stammIdx = $index) {
          <div class="col-xl-3 col-lg-4 col-sm-6">
            <app-stamm
              [stammIdx]="stammIdx"
              [group]="group"
              [dragOverZone]="dragOverZone()"
              [showIds]="showIds()"
              [details]="details()"
              [allParticipants]="allParticipants()"
              (dragOverNode)="allowDrop($event, 'stamm-' + stammIdx)"
              (dragLeaveNode)="onDragLeave($event, 'stamm-' + stammIdx)"
              (dropNode)="onDrop($event, 'stamm-' + stammIdx)"
              (dragStartItem)="onDragStart($event.event, $event.payload)"
              (resetItem)="resetParticipant($event)"
            ></app-stamm>
          </div>
        }
      </div>
    </div>
  </div>

  @if ($anmeldungen().length > 0) {
    <app-pool-toolbar
      [pools]="$pools()"
      [dragOverZone]="dragOverZone()"
      [showIds]="showIds()"
      [details]="details()"
      [allParticipants]="allParticipants()"
      [progress]="$progress()"
      [isDirty]="isDirty()"
      [isDragging]="isDragging()"
      (toggleIds)="toggleIds()"
      (toggleDetails)="toggleDetails()"
      (confirmLoadServer)="confirmLoadServer()"
      (saveGroupsServer)="saveGroupsServer()"
      (dragOverNode)="allowDrop($event.event, $event.zone)"
      (dragLeaveNode)="onDragLeave($event.event, $event.zone)"
      (dropNode)="onDrop($event.event, $event.zone)"
      (dragStartItem)="onDragStart($event.event, $event.payload)"
      (resetItem)="resetParticipant($event)"
    ></app-pool-toolbar>
  }
</div>
